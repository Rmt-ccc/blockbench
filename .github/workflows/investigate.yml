name: Investigate build setup

on:
  push:
    branches: [ next ]
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show package.json
        run: cat package.json

      - name: Show README (build/dev instructions)
        run: cat readme.md || cat README.md || echo "no readme found"

      - name: Install dependencies
        run: npm install

      - name: List available npm scripts
        run: npm run

      - name: Search for isApp usage in build config
        run: grep -rn "isApp" build.js || echo "build.js not found or no matches"

      - name: Build web version
        run: npm run build-web

      - name: Show output directory structure
        run: |
          echo "----- Top level after build -----"
          ls -la
          echo "----- dist/ (if exists) -----"
          ls -la dist/ 2>/dev/null || echo "no dist/ folder"
          echo "----- js/ (if exists) -----"
          ls -la js/ 2>/dev/null || echo "no js/ folder"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist/
            index.html
            css/
            font/
            assets/
          if-no-files-found: warn
