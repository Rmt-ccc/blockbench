name: Investigate build setup

on:
  push:
    branches: [ next ]
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web version
        run: npm run build-web

      - name: Show index.html content
        run: cat index.html

      - name: Show output directory structure
        run: |
          echo "----- Top level after build -----"
          ls -la
          echo "----- dist/ -----"
          ls -la dist/ 2>/dev/null || echo "no dist/ folder"
          echo "----- lib/ -----"
          ls -la lib/ 2>/dev/null || echo "no lib/ folder"
          echo "----- lang/ -----"
          ls -la lang/ 2>/dev/null || echo "no lang/ folder"
          echo "----- icons/ -----"
          ls -la icons/ 2>/dev/null || echo "no icons/ folder"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            dist/bundle.js
            index.html
            css/
            font/
            assets/
            lib/
            lang/
            keymaps/
            themes/
            icons/
            manifest.webmanifest
            favicon.png
            icon.png
            icon_full.png
            icon_maskable.png
          if-no-files-found: warn
