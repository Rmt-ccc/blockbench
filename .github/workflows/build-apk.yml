name: Build Android APK

on:
  push:
    branches: [ next ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Build web version
        run: npm run build-web

      - name: Copy web build into Android assets
        run: |
          rm -rf Android/app/src/main/assets/www
          mkdir -p Android/app/src/main/assets/www
          cp -r dist Android/app/src/main/assets/www/
          rm -f Android/app/src/main/assets/www/dist/bundle.js.map
          cp index.html Android/app/src/main/assets/www/
          cp -r css Android/app/src/main/assets/www/
          cp -r assets Android/app/src/main/assets/www/
          cp -r font Android/app/src/main/assets/www/
          cp -r lib Android/app/src/main/assets/www/
          cp -r lang Android/app/src/main/assets/www/
          cp -r keymaps Android/app/src/main/assets/www/
          cp -r themes Android/app/src/main/assets/www/
          cp -r icons Android/app/src/main/assets/www/
          cp manifest.webmanifest Android/app/src/main/assets/www/
          cp favicon.png icon.png icon_full.png icon_maskable.png Android/app/src/main/assets/www/
          echo "----- www/ contents -----"
          find Android/app/src/main/assets/www -maxdepth 2

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare app icon (legacy + adaptive)
        run: |
          mkdir -p Android/app/src/main/res/mipmap-mdpi
          mkdir -p Android/app/src/main/res/mipmap-hdpi
          mkdir -p Android/app/src/main/res/mipmap-xhdpi
          mkdir -p Android/app/src/main/res/mipmap-xxhdpi
          mkdir -p Android/app/src/main/res/mipmap-xxxhdpi

          # legacy square icon (pre-Android 8 devices)
          convert icon_full.png -resize 48x48   Android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon_full.png -resize 72x72   Android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon_full.png -resize 96x96   Android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon_full.png -resize 144x144 Android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon_full.png -resize 192x192 Android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # adaptive icon foreground layer (Android 8+, round/squircle/etc. handled by the OS)
          convert icon_maskable.png -resize 108x108 Android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert icon_maskable.png -resize 162x162 Android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert icon_maskable.png -resize 216x216 Android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert icon_maskable.png -resize 324x324 Android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert icon_maskable.png -resize 432x432 Android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          echo "----- mipmap contents -----"
          find Android/app/src/main/res -maxdepth 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
