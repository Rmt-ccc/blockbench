name: Build Android APK

on:
  push:
    branches: [ next ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Build web version
        run: npm run build-web

      - name: Copy web build into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/dist/bundle.js.map
          cp index.html android/app/src/main/assets/www/
          cp -r css android/app/src/main/assets/www/
          cp -r assets android/app/src/main/assets/www/
          cp -r font android/app/src/main/assets/www/
          cp -r lib android/app/src/main/assets/www/
          cp -r lang android/app/src/main/assets/www/
          cp -r keymaps android/app/src/main/assets/www/
          cp -r themes android/app/src/main/assets/www/
          cp -r icons android/app/src/main/assets/www/
          cp manifest.webmanifest android/app/src/main/assets/www/
          cp favicon.png icon.png icon_full.png icon_maskable.png android/app/src/main/assets/www/
          echo "----- www/ contents -----"
          find android/app/src/main/assets/www -maxdepth 2

      - name: Show android/ directory structure
        run: find android -maxdepth 4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blockbench-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Locate APK and compute hash
        id: apkinfo
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found" >&2
            exit 1
          fi
          SHA256=$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Scan APK with VirusTotal
        id: virustotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          curl -sS --request POST \
            --url https://www.virustotal.com/api/v3/files \
            --header "x-apikey: $VIRUSTOTAL_API_KEY" \
            --form "file=@${{ steps.apkinfo.outputs.path }}" \
            -o vt_response.json

          cat vt_response.json
          VT_URL="https://www.virustotal.com/gui/file/${{ steps.apkinfo.outputs.sha256 }}"
          echo "report_url=$VT_URL" >> "$GITHUB_OUTPUT"

      - name: Upload APK to appetize.io
        id: appetize
        env:
          APPETIZE_API_KEY: ${{ secrets.APPETIZE_API_KEY }}
        run: |
          curl -sS -u "$APPETIZE_API_KEY:" \
            -F "platform=android" \
            -F "file=@${{ steps.apkinfo.outputs.path }}" \
            https://api.appetize.io/v1/apps \
            -o appetize_response.json

          cat appetize_response.json
          PUBLIC_URL=$(jq -r '.publicURL' appetize_response.json)
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            echo "### Blockbench Mobile - Build Results"
            echo ""
            echo "- APK SHA256: \`${{ steps.apkinfo.outputs.sha256 }}\`"
            echo "- VirusTotal report: ${{ steps.virustotal.outputs.report_url }}"
            echo "- appetize.io preview: ${{ steps.appetize.outputs.public_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Blockbench Mobile build #${{ github.run_number }}"
          body: |
